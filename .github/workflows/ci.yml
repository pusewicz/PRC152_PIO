name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# GitHub's default Linux shell is `bash -e`, which does NOT set pipefail -- so a
# failing `pio run | tee ...` would report success. `shell: bash` gets us
# `bash -eo pipefail`, making build failures in a pipeline actually fail.
defaults:
  run:
    shell: bash

jobs:
  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check platformio.ini and FCS152_KDU.h agree
        run: python3 .github/scripts/check_version_sync.py

  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: release
            build_flags: ""
          - variant: debug
            # Large parts of the tree sit behind #ifdef DEBUG and are otherwise
            # never compiled. Building them keeps that code from rotting.
            build_flags: "-DDEBUG"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Caching all of ~/.platformio would be counterproductive: it is ~2 GB and
      # would thrash the 10 GB per-repo cache limit across matrix entries. The
      # download cache is the part worth keeping.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build
        env:
          PLATFORMIO_BUILD_FLAGS: ${{ matrix.build_flags }}
        run: pio run

      - name: Report size
        run: pio run --target size | tee size-${{ matrix.variant }}.txt

      - name: Upload firmware
        if: matrix.variant == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          if-no-files-found: error
          path: |
            .pio/build/esp32-s2-saola-1/*.bin
            .pio/build/esp32-s2-saola-1/*.elf

      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: size-${{ matrix.variant }}
          path: size-${{ matrix.variant }}.txt

  check:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      # Non-blocking on purpose: the known-defect backlog would otherwise fail
      # every run. Read the report, do not gate on it -- yet.
      #
      # --skip-packages skips the framework/toolchain but NOT lib_deps, so
      # cppcheck also analyses ArduinoJson and its ~128 findings drown out the
      # ~19 from this project. Keep the full log, but lead with our own code.
      - name: Run pio check
        continue-on-error: true
        run: |
          pio check --skip-packages --severity=high --severity=medium \
            | tee check-raw.txt
          {
            echo "=== src/ and include/ ==="
            grep -E '^(src|include)/' check-raw.txt || echo "(no findings)"
            echo
            echo "=== third-party (lib_deps), for reference ==="
            grep -cE '^\.pio/libdeps' check-raw.txt | sed 's/$/ findings suppressed/'
          } > check-report.txt
          cat check-report.txt

      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis
          path: |
            check-report.txt
            check-raw.txt

  size-report:
    name: Size report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the base commit to build it

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      # Keep the reporting script out of the working tree: the base commit may
      # predate it (or differ), and we check the base out below.
      - name: Stash reporting script
        run: cp .github/scripts/size_report.py "$RUNNER_TEMP/size_report.py"

      - name: Build this PR
        run: pio run | tee "$RUNNER_TEMP/size-head.txt"

      # If the base does not build, carry on and report absolute sizes only --
      # a broken base should not hide this PR's numbers.
      - name: Build base for comparison
        continue-on-error: true
        run: |
          git checkout --detach ${{ github.event.pull_request.base.sha }}
          pio run | tee "$RUNNER_TEMP/size-base.txt"

      - name: Restore PR checkout
        run: git checkout --force ${{ github.event.pull_request.head.sha }}

      - name: Build report
        run: |
          touch "$RUNNER_TEMP/size-base.txt"
          python3 "$RUNNER_TEMP/size_report.py" \
            --base "$RUNNER_TEMP/size-base.txt" \
            --head "$RUNNER_TEMP/size-head.txt" \
            --out  "$RUNNER_TEMP/report.md"

      # Update the existing comment rather than adding one per push.
      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq '[.[] | select(.body | contains("<!-- size-report -->"))] | .[0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              -F body=@"$RUNNER_TEMP/report.md"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              -F body=@"$RUNNER_TEMP/report.md"
          fi
