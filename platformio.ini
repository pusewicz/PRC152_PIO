; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s2-saola-1

; lib/pure_logic's headers reach back into the project's include/ dir
; (kdu_protocol.h, bsp_json.h). PlatformIO's LDF scopes each lib/ library's
; CPPPATH to its own folder plus its resolved lib dependencies — it does not
; propagate the project-level include/ dir back into library builds. Add it
; explicitly so lib/pure_logic compiles in every environment (native and
; firmware alike).
[env]
build_flags = -Iinclude

[env:esp32-s2-saola-1]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
upload_port = COM17
upload_speed = 1152000
monitor_port = COM17
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^6.19.4

build_flags =
    ${env.build_flags}
    -DVERSION=${this.custom_prog_version}
extra_scripts = pre:name_firmware.py
custom_prog_version = Rev-2.2.5507

[env:esp32-s2-saola-1-dev]
extends = env:esp32-s2-saola-1
build_flags =
    ${env.build_flags}
    -DVERSION=${env:esp32-s2-saola-1.custom_prog_version}
    -DDEVCONSOLE

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    ${env.build_flags}
    -DUNITY_INCLUDE_DOUBLE
