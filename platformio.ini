; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s2-saola-1

[env:esp32-s2-saola-1]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
upload_port = COM17
upload_speed = 1152000
monitor_port = COM17
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^6.19.4

build_flags =
    -DVERSION=${this.custom_prog_version}
extra_scripts = pre:name_firmware.py
custom_prog_version = Rev-2.2.5507

[env:esp32-s2-saola-1-dev]
extends = env:esp32-s2-saola-1
build_flags =
    -DVERSION=${env:esp32-s2-saola-1.custom_prog_version}
    -DDEVCONSOLE
